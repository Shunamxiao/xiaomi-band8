<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cindy Band 控制台</title>
<style>
  :root {
    color-scheme: light;
    --brand: #1677FF;
    --brand-hover: #4096FF;
    --brand-active: #0958D9;
    --brand-bg: #E6F4FF;
    --bg: #F5F7FA;
    --card: #FFFFFF;
    --text: #1F2329;
    --text-2: #646A73;
    --text-3: #8F959E;
    --line: #EFF0F1;
    --success: #52C41A;
    --warning: #FAAD14;
    --danger: #FF4D4F;
    --radius: 8px;
    --shadow: 0 1px 2px rgba(31, 35, 41, .03), 0 2px 8px -1px rgba(31, 35, 41, .04);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    font-size: 14px;
    line-height: 1.5715;
    -webkit-font-smoothing: antialiased;
  }
  .topbar {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; gap: 12px;
    height: 56px; padding: 0 24px;
    background: rgba(255,255,255,.92);
    backdrop-filter: saturate(180%) blur(12px);
    border-bottom: 1px solid var(--line);
  }
  .logo {
    display: grid; place-items: center;
    width: 30px; height: 30px; border-radius: 8px;
    background: linear-gradient(135deg, #1677FF, #4096FF);
    color: #fff; font-weight: 700; font-size: 15px;
  }
  .topbar h1 { margin: 0; font-size: 16px; font-weight: 600; letter-spacing: -.01em; }
  .topbar .sub { color: var(--text-3); font-size: 12px; margin-left: 2px; }
  .grow { flex: 1; }
  .status {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 3px 10px; border-radius: 999px;
    background: #F6FFED; color: #389E0D; font-size: 12px;
    border: 1px solid #B7EB8F;
  }
  .status.off { background: #FFF2F0; color: #CF1322; border-color: #FFCCC7; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

  .wrap {
    max-width: 1120px; margin: 0 auto; padding: 24px;
    display: grid; grid-template-columns: minmax(0, 1.9fr) minmax(0, 1fr);
    gap: 16px; align-items: start;
  }
  .col { display: grid; gap: 16px; }
  .card {
    background: var(--card); border-radius: var(--radius);
    box-shadow: var(--shadow); border: 1px solid rgba(31,35,41,.04);
    overflow: hidden;
  }
  .card-head {
    display: flex; align-items: center; gap: 8px;
    padding: 16px 20px 0;
  }
  .card-head h2 { margin: 0; font-size: 15px; font-weight: 600; }
  .card-head .hint { color: var(--text-3); font-size: 12px; margin-left: auto; }
  .card-body { padding: 16px 20px 20px; }

  .field { margin-bottom: 14px; }
  .field:last-child { margin-bottom: 0; }
  label.lb { display: block; margin-bottom: 6px; color: var(--text-2); font-size: 13px; }
  input[type=text], textarea {
    width: 100%; padding: 6px 11px;
    border: 1px solid #D9D9D9; border-radius: 6px;
    background: #fff; color: var(--text); font: inherit;
    transition: border-color .15s, box-shadow .15s;
  }
  input[type=text] { height: 34px; }
  textarea { min-height: 68px; resize: vertical; }
  input[type=text]:hover, textarea:hover { border-color: var(--brand-hover); }
  input[type=text]:focus, textarea:focus {
    outline: none; border-color: var(--brand-hover);
    box-shadow: 0 0 0 2px rgba(22,119,255,.12);
  }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .row.tight { gap: 8px; }
  .btn {
    height: 34px; padding: 0 16px; border-radius: 6px;
    border: 1px solid transparent; background: var(--brand); color: #fff;
    font: inherit; cursor: pointer; transition: background .15s, border-color .15s;
  }
  .btn:hover { background: var(--brand-hover); }
  .btn:active { background: var(--brand-active); }
  .btn.ghost {
    background: #fff; color: var(--text); border-color: #D9D9D9;
  }
  .btn.ghost:hover { color: var(--brand); border-color: var(--brand-hover); }
  .btn.danger { background: #fff; color: var(--danger); border-color: #FFCCC7; }
  .btn.danger:hover { border-color: var(--danger); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }

  .switch-row {
    display: flex; align-items: flex-start; gap: 12px;
    padding: 12px 0; border-bottom: 1px solid var(--line);
  }
  .switch-row:first-child { padding-top: 0; }
  .switch-row:last-of-type { border-bottom: 0; }
  .switch-row .text { flex: 1; min-width: 0; }
  .switch-row .text b { display: block; font-weight: 500; font-size: 14px; }
  .switch-row .text span { display: block; color: var(--text-3); font-size: 12px; margin-top: 2px; }
  .switch { position: relative; width: 44px; height: 22px; flex: 0 0 44px; margin-top: 2px; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch i {
    position: absolute; inset: 0; border-radius: 999px; background: #BFBFBF;
    transition: background .2s; cursor: pointer;
  }
  .switch i::after {
    content: ""; position: absolute; width: 18px; height: 18px; border-radius: 50%;
    left: 2px; top: 2px; background: #fff; transition: transform .2s;
    box-shadow: 0 1px 3px rgba(0,0,0,.2);
  }
  .switch input:checked + i { background: var(--brand); }
  .switch input:checked + i::after { transform: translateX(22px); }

  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .stat {
    background: #FAFBFC; border: 1px solid var(--line); border-radius: 6px;
    padding: 10px 12px;
  }
  .stat b { display: block; font-size: 20px; font-weight: 600; letter-spacing: -.02em; }
  .stat span { color: var(--text-3); font-size: 12px; }

  .list { display: grid; }
  .list-item {
    display: grid; grid-template-columns: 64px 88px minmax(0, 1fr);
    gap: 8px; padding: 10px 0; border-bottom: 1px solid var(--line);
    align-items: start; font-size: 13px;
  }
  .list-item:last-child { border-bottom: 0; }
  .time { color: var(--text-3); font-variant-numeric: tabular-nums; font-size: 12px; }
  .tag {
    display: inline-block; padding: 0 7px; border-radius: 4px;
    font-size: 12px; line-height: 20px; height: 20px;
    background: #F5F5F5; color: var(--text-2); white-space: nowrap;
  }
  .tag.notification { background: var(--brand-bg); color: #0958D9; }
  .tag.suppressed { background: #FFF7E6; color: #D46B08; }
  .tag.result { background: #F6FFED; color: #389E0D; }
  .event-text { min-width: 0; }
  .event-text b { font-weight: 500; }
  .event-text span { color: var(--text-3); word-break: break-all; }
  .muted { color: var(--text-3); font-size: 12px; }
  .empty { padding: 24px 0; text-align: center; color: var(--text-3); font-size: 13px; }

  .notice {
    background: #FFF7E6; border: 1px solid #FFE7BA; color: #AD6800;
    padding: 10px 12px; border-radius: 6px; font-size: 12px; line-height: 1.6;
  }
  .toast {
    position: fixed; left: 50%; top: 72px; transform: translateX(-50%);
    background: rgba(31,35,41,.9); color: #fff; padding: 8px 16px;
    border-radius: 6px; font-size: 13px; opacity: 0; pointer-events: none;
    transition: opacity .2s; z-index: 20;
  }
  .toast.show { opacity: 1; }

  @media (max-width: 860px) {
    .wrap { grid-template-columns: 1fr; padding: 16px; }
    .topbar { padding: 0 16px; }
    .topbar .sub { display: none; }
    .list-item { grid-template-columns: 56px 78px minmax(0, 1fr); }
  }
</style>
</head>
<body>
<div class="topbar">
  <div class="logo">C</div>
  <h1>Cindy Band</h1>
  <span class="sub">小米手环 8 · 本地服务</span>
  <div class="grow"></div>
  <span class="status" id="status"><i class="dot"></i><span>连接中…</span></span>
</div>

<div class="wrap">
  <div class="col">
    <div class="card">
      <div class="card-head"><h2>通知与转发</h2><span class="hint">保存后立即同步到手机 App</span></div>
      <div class="card-body">
        <div class="switch-row">
          <div class="text"><b>转发通知</b><span>接收手机通知并推送到手环</span></div>
          <label class="switch"><input id="cfgEnabled" type="checkbox" checked><i></i></label>
        </div>
        <div class="switch-row">
          <div class="text"><b>通知震动</b><span>关闭后通知仅记录，不推送手环（固件不支持单条静默）</span></div>
          <label class="switch"><input id="cfgVibrate" type="checkbox" checked><i></i></label>
        </div>
        <div class="field" style="margin-top:14px">
          <label class="lb">显示的应用名</label>
          <input id="cfgAppName" type="text" value="Cindy">
        </div>
        <div class="field">
          <label class="lb">屏蔽的应用包名（每行一个）</label>
          <textarea id="cfgBlocked" spellcheck="false"></textarea>
        </div>
        <div class="row">
          <button class="btn" onclick="saveConfig()">保存配置</button>
          <span class="muted" id="cfgState"></span>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-head"><h2>推送通知</h2><span class="hint">手动发一条到手环</span></div>
      <div class="card-body">
        <div class="field">
          <label class="lb">标题</label>
          <input id="title" type="text" value="Cindy">
        </div>
        <div class="field">
          <label class="lb">正文</label>
          <input id="body" type="text" value="来自服务端的测试消息">
        </div>
        <div class="switch-row" style="padding:4px 0 12px;border:0">
          <div class="text"><b>本条震动</b><span>关闭则只记录，不打扰</span></div>
          <label class="switch"><input id="sendVibrate" type="checkbox" checked><i></i></label>
        </div>
        <div class="row">
          <button class="btn" onclick="sendNotify()">发送</button>
          <button class="btn ghost" onclick="loadAll()">刷新</button>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-head"><h2>最近事件</h2><span class="hint">最近 20 条</span></div>
      <div class="card-body">
        <div class="list" id="events"><div class="empty">加载中…</div></div>
      </div>
    </div>
  </div>

  <div class="col">
    <div class="card">
      <div class="card-head"><h2>运行状态</h2></div>
      <div class="card-body">
        <div class="stats">
          <div class="stat"><b id="stEvents">–</b><span>事件</span></div>
          <div class="stat"><b id="stPending">–</b><span>待下发</span></div>
          <div class="stat"><b id="stVibrate">–</b><span>震动</span></div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-head"><h2>快捷操作</h2></div>
      <div class="card-body">
        <div class="row tight">
          <button class="btn ghost" onclick="quick('/api/v1/find')">查找手环</button>
          <button class="btn ghost" onclick="quick('/api/v1/dnd?enabled=true')">免打扰开</button>
          <button class="btn ghost" onclick="quick('/api/v1/dnd?enabled=false')">免打扰关</button>
        </div>
        <div class="row tight" style="margin-top:8px">
          <button class="btn danger" onclick="quick('/api/v1/desk/stop')">停止桌搭</button>
          <button class="btn ghost" onclick="quick('/api/v1/screen-on?enabled=true')">通知亮屏</button>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-head"><h2>说明</h2></div>
      <div class="card-body">
        <div class="notice">
          手环固件没有“单条通知不震动”的协议字段。关闭震动时，系统会记录通知但不下发，
          避免打扰；需要显示但静音的场景暂不支持。
        </div>
        <p class="muted" style="margin:12px 0 0">
          服务端与手机 App 共用同一份配置；App 内切换开关会立即回写到这里。
        </p>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const $ = (id) => document.getElementById(id);
let toastTimer = null;

function toast(msg) {
  const el = $('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 1800);
}

async function api(path, opts) {
  const res = await fetch(path, opts);
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return res.json();
}

async function loadAll() {
  try {
    const health = await api('/api/v1/health');
    const cfg = await api('/api/v1/config');
    const data = await api('/api/v1/events?limit=20');

    $('status').className = 'status';
    $('status').innerHTML = '<i class="dot"></i><span>服务正常</span>';
    $('stEvents').textContent = health.events;
    $('stPending').textContent = health.pending_commands;
    $('stVibrate').textContent = cfg.notify_vibrate ? '开' : '关';

    if (document.activeElement !== $('cfgAppName')) $('cfgAppName').value = cfg.app_name || 'Cindy';
    if (document.activeElement !== $('cfgBlocked')) {
      $('cfgBlocked').value = (cfg.blocked_packages || []).join('\n');
    }
    $('cfgEnabled').checked = !!cfg.enabled;
    $('cfgVibrate').checked = !!cfg.notify_vibrate;

    renderEvents(data.items || []);
  } catch (e) {
    $('status').className = 'status off';
    $('status').innerHTML = '<i class="dot"></i><span>服务不可用</span>';
  }
}

function renderEvents(items) {
  const box = $('events');
  if (!items.length) {
    box.innerHTML = '<div class="empty">暂无事件</div>';
    return;
  }
  box.innerHTML = '';
  for (const e of items) {
    const row = document.createElement('div');
    row.className = 'list-item';

    const time = document.createElement('div');
    time.className = 'time';
    time.textContent = new Date(e.ts).toLocaleTimeString('zh-CN', { hour12: false });

    const tagWrap = document.createElement('div');
    const tag = document.createElement('span');
    const type = e.type || 'event';
    tag.className = 'tag ' + (type === 'notification' ? 'notification'
      : type === 'notification_suppressed' ? 'suppressed'
      : type === 'command_result' ? 'result' : '');
    tag.textContent = type === 'notification' ? '通知'
      : type === 'notification_suppressed' ? '已静默'
      : type === 'command_result' ? '命令' : type;
    tagWrap.appendChild(tag);

    const text = document.createElement('div');
    text.className = 'event-text';
    const b = document.createElement('b');
    b.textContent = (e.title || e.package || '').slice(0, 120);
    const span = document.createElement('span');
    span.textContent = e.body ? ' · ' + e.body.slice(0, 160) : '';
    text.appendChild(b);
    text.appendChild(span);

    row.appendChild(time);
    row.appendChild(tagWrap);
    row.appendChild(text);
    box.appendChild(row);
  }
}

async function saveConfig() {
  const payload = {
    enabled: $('cfgEnabled').checked,
    notify_vibrate: $('cfgVibrate').checked,
    app_name: $('cfgAppName').value.trim() || 'Cindy',
    blocked_packages: $('cfgBlocked').value.split('\n').map(s => s.trim()).filter(Boolean),
  };
  await api('/api/v1/config', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload),
  });
  $('cfgState').textContent = '已保存';
  toast('配置已保存');
  loadAll();
}

async function sendNotify() {
  const payload = {
    title: $('title').value,
    body: $('body').value,
    app: $('cfgAppName').value.trim() || 'Cindy',
    vibrate: $('sendVibrate').checked,
  };
  const res = await api('/api/v1/notify', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload),
  });
  toast(res.vibrate ? '已排队发送（震动）' : '已排队（静默）');
  loadAll();
}

async function quick(path) {
  await api(path, { method: 'POST' });
  toast('指令已排队');
  loadAll();
}

loadAll();
setInterval(loadAll, 10000);
</script>
</body>
</html>
